<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8fbff">
    <meta name="description" content="iPhoneのホーム画面から1タップで開ける釣り用タイドグラフPWA">
    <meta name="application-name" content="temochiz潮時表">
    <meta name="apple-mobile-web-app-title" content="temochiz潮時表">
    <title>temochiz潮時表</title>
    <link rel="manifest" href="./manifest.webmanifest?v=20260811-17">
    <link rel="icon" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./css/app.css?v=20260823-2">
  </head>
  <body>
    <main class="app-shell">
      <section class="controls" aria-label="表示条件">
        <div class="controls-top">
          <p class="eyebrow">TideGraph</p>
          <p class="edition-badge">2026年版</p>
        </div>
        <div class="picker-row">
          <label class="station-picker">
            <select id="stationSelect" aria-label="地点"></select>
          </label>
          <div class="date-picker">
            <div class="date-picker-row">
              <input id="dateInput" type="date" aria-label="日付">
              <button id="todayButton" type="button">今日</button>
            </div>
          </div>
        </div>
        <div class="tide-summary" aria-live="polite">
          <h2>次の満潮・干潮</h2>
          <div id="tideInfo" class="tide-info">潮回りを計算中</div>
          <div id="nextTide" class="next-tide">--</div>
        </div>
      </section>

      <section class="graph-card">
        <div class="graph-heading">
          <h2>24時間タイドグラフ</h2>
          <p id="rangeLabel">単位: cm</p>
        </div>
        <div id="graphRoot" class="graph-root" role="img" aria-label="潮位グラフ"></div>
        <div id="pointReadout" class="point-readout">グラフ上の点をタップすると時刻と潮位を表示します。</div>
      </section>

      <section id="message" class="message" hidden></section>

      <footer class="footer">
        <p>出典: 気象庁潮位表データをもとに本アプリで表示加工。</p>
        <p>表示値は予測潮位です。安全航行用の装置として扱わず、専門的な判断には使用しないでください。</p>
        <p id="dataUpdated">最終データ更新日: --</p>
        <p>ビルド日時: 2026-08-23 03:21 JST</p>
      </footer>
    </main>

    <script src="./data/stations.js?v=20260823-2"></script>
    <script src="./data/2026/TK.js?v=20260823-2"></script>
    <script src="./js/tide-graph.js?v=20260823-2"></script>
    <script src="./js/data.js?v=20260823-2"></script>
    <script src="./js/app.js?v=20260823-2"></script>
  </body>
</html>
