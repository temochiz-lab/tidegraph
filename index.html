<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8fbff">
    <meta name="description" content="iPhoneホーム画面から1タップで開ける釣り用タイドグラフPWA">
    <title>TideGraph</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./css/app.css?v=20260811-10">
  </head>
  <body>
    <div class="loading-overlay" id="loadingStatus" role="status" aria-live="polite" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <span>読み込み中...</span>
    </div>
    <main class="app-shell">
      <section class="controls" aria-label="表示条件">
        <div class="controls-top">
          <p class="eyebrow">TideGraph</p>
          <div class="status-pill" id="connectionStatus">online</div>
        </div>
        <div class="picker-row">
          <label class="station-picker">
            <select id="stationSelect" aria-label="地点"></select>
          </label>
          <div class="date-picker">
            <div class="date-picker-row">
              <input id="dateInput" type="date" aria-label="日付">
              <button id="todayButton" type="button">今日</button>
              <span class="date-loading-chip" id="dateLoadingStatus" role="status" aria-live="polite" hidden>
                <span class="mini-spinner" aria-hidden="true"></span>
                読み込み中...
              </span>
            </div>
          </div>
        </div>
        <div class="tide-summary" aria-live="polite">
          <h2>次の満潮・干潮</h2>
          <div id="nextTide" class="next-tide">データを読み込み中です</div>
        </div>
      </section>

      <section class="graph-card">
        <div class="graph-heading">
          <h2>24時間タイドグラフ</h2>
          <p id="rangeLabel">単位: cm</p>
        </div>
        <div id="graphRoot" class="graph-root" role="img" aria-label="潮位グラフ"></div>
        <div id="pointReadout" class="point-readout">グラフ上の点をタップすると時刻と潮位を表示します。</div>
      </section>

      <section id="message" class="message" hidden></section>

      <footer class="footer">
        <p>出典: 気象庁潮位表データをもとに本アプリで表示加工。</p>
        <p>表示値は予測潮位です。安全航行用の装置として扱わず、専門的な判断には使用しないでください。</p>
        <p id="dataUpdated">最終データ更新日: --</p>
      </footer>
    </main>

    <script src="./data/2026/TK.js?v=20260811-10"></script>
    <script src="./js/tide-graph.js?v=20260811-10"></script>
    <script src="./js/data.js?v=20260811-10"></script>
    <script src="./js/app.js?v=20260811-10"></script>
  </body>
</html>
