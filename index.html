<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8fbff">
    <meta name="description" content="iPhoneホーム画面から1タップで開ける釣り用タイドグラフPWA">
    <title>TideGraph</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./css/app.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">TideGraph</p>
          <h1 id="stationName">潮位を読み込み中</h1>
          <p id="dateLabel" class="date-label">--</p>
        </div>
        <div class="status-pill" id="connectionStatus">online</div>
      </header>

      <section class="controls" aria-label="表示条件">
        <label class="station-picker visually-compact">
          <select id="stationSelect"></select>
        </label>
        <div class="date-picker">
          <div class="date-picker-row">
            <input id="dateInput" type="date">
            <button id="todayButton" type="button">今日</button>
          </div>
        </div>
      </section>

      <section class="summary-card" aria-live="polite">
        <h2>次の満潮・干潮</h2>
        <div id="nextTide" class="next-tide">データを読み込み中です</div>
      </section>

      <section class="graph-card">
        <div class="graph-heading">
          <h2>24時間タイドグラフ</h2>
          <p id="rangeLabel">単位: cm</p>
        </div>
        <div id="graphRoot" class="graph-root" role="img" aria-label="潮位グラフ"></div>
        <div id="pointReadout" class="point-readout">グラフ上の点をタップすると時刻と潮位を表示します。</div>
      </section>

      <section id="message" class="message" hidden></section>

      <footer class="footer">
        <p>出典: 気象庁潮位表データをもとに本アプリで表示加工。</p>
        <p>表示値は予測潮位です。安全航行用の装置として扱わず、専門的な判断には使用しないでください。</p>
        <p id="dataUpdated">最終データ更新日: --</p>
      </footer>
    </main>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
